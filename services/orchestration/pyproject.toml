[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestration"
version = "0.1.0"
description = "Dagster orchestration for the datalake medallion lakehouse"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9",
    "dagster-duckdb>=0.29",
    "dagster-webserver>=1.9",
    "duckdb>=1.0",
    "httpx",
    "polars>=1.0",
    "pydantic>=2.0",
    "python-dotenv",
    "tenacity",
    "pyarrow>=24.0.0",
    "opsdb",
    "apify-client>=3.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]

# `opsdb` is a sibling workspace member; this is the documented form for an
# intra-workspace dependency (without it uv refuses to resolve the member).
[tool.uv.sources]
opsdb = { workspace = true }
