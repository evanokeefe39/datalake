[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]

[project]
name = "jobs"
version = "0.1.0"
description = "Standalone domain-agnostic async batch service: submit (prompt, images) jobs, run them against qwen via OpenRouter, poll and harvest results. Owns its own SQLite state."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
jobs = "jobs.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]
